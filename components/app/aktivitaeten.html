<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F0ECE3">
<title>ELANUM · Aktivitäten</title>
<link rel="icon" href="../../assets/ELANUM-Master-Spektrum-Harmonic.svg" type="image/svg+xml">
<script src="../../assets/boot.js" data-base="../../"></script>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../base.css">
<link rel="stylesheet" href="../zeichen/zeichen.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="screens.css">
</head>
<body class="app" data-screen="aktivitaeten">
<a class="skip-link" href="#main">Direkt zum Inhalt</a>
<nav data-app-nav></nav>
<header class="app-head">
  <a class="app-head__brand" href="aktivitaeten.html" aria-label="ELANUM, Aktivitäten"><span class="zeichen" data-zeichen="lichtlauf"><img src="../../assets/ELANUM-Master-Spektrum-Harmonic.svg" alt="" width="32" height="32"></span></a>
  <p class="app-head__title" aria-hidden="true"></p>
  <div class="app-head__actions">
    <button class="app-icon-button glow-edge" type="button" aria-label="Region und Kategorie wählen"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" data-icon="filter"></svg></button>
  </div>
</header>

<main class="app-main" id="main" tabindex="-1">
  <header class="app-pagehead">
    <p class="app-kicker">Zürich und Umgebung</p>
    <h1 class="app-title">Diese Woche in deiner Nähe</h1>
    <p class="app-lead">Aktivitäten und Events, unabhängig vom Dating. Du siehst, wer dabei ist, bevor du zusagst.</p>
  </header>

  <div class="app-stack" style="--gap:28px">
    <div class="segmented erleben-when" role="group" aria-label="Zeitraum">
      <button class="glow-edge" type="button" aria-pressed="true">Diese Woche</button><button class="glow-edge" type="button" aria-pressed="false">Wochenende</button><button class="glow-edge" type="button" aria-pressed="false">Später</button>
    </div>
    <ul class="app-grid app-grid--3" data-events></ul>
  </div>

  <div class="app-actions app-actions--end">
    <button class="button button--secondary glow-edge" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" data-icon="plus"></svg>Eigenes Vorhaben planen</button>
  </div>
</main>

<dialog data-sheet id="eventSheet" aria-labelledby="eventTitle">
  <span class="app-sheet__grip" aria-hidden="true"></span>
  <div class="app-sheet__head"><p class="app-kicker" data-event-kind></p><button class="app-icon-button glow-edge" type="button" data-close aria-label="Schliessen"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" data-icon="schliessen"></svg></button></div>
  <div class="app-sheet__body" data-event-body></div>
</dialog>

<script src="../zeichen/zeichen.js"></script>
<script src="app.js"></script>
<script src="screens.js"></script>
</body>
</html>
